<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>Flash row register holding one S-box row</title>
<desc>The AES S-box in flash as aligned 16-byte rows. A lookup copies one whole row into the row register. Within that row the byte the lookup asked for is one colour and the fifteen that came with it another, while the rest of the S-box still in flash is a third. A later lookup landing in the resident row is fast; anywhere else reloads the register.</desc>
<style>
svg{--ink:#3d3d3a;--line:#73726c}
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.r-gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.r-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.r-coral{fill:#FAECE7;stroke:#993C1D;stroke-width:1}
.x-gray{fill:#2C2C2A}
.x-teal{fill:#04342C}
.x-coral{fill:#4A1B0C}
.ink{fill:var(--ink)}
.arr{fill:none;stroke:var(--line);stroke-width:1.5}
.leader{fill:none;stroke:var(--line);stroke-width:.5;stroke-dasharray:3 3}
@media (prefers-color-scheme:dark){
svg{--ink:#c2c0b6;--line:#9c9a92}
.r-gray{fill:#444441;stroke:#B4B2A9}
.r-teal{fill:#085041;stroke:#5DCAA5}
.r-coral{fill:#712B13;stroke:#F0997B}
.x-gray{fill:#D3D1C7}
.x-teal{fill:#9FE1CB}
.x-coral{fill:#F5C4B3}
}
</style>
